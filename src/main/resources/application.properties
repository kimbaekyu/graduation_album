spring.application.name=graduation_album

# H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:file:./data/graduation_album;MODE=MYSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# 파일 업로드 크기 제한 (50MB)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 로컬/NAS 저장소 (FileController에서 경로를 읽어 서빙할 때 사용)
# - Windows NAS 예시(UNC): \\NAS\share\graduation_album
# - Windows 드라이브 예시: Z:\graduation_album
# - 기본값은 프로젝트 하위 폴더입니다.
app.storage.base-path=./storage
# true면 DB에 저장된 절대경로(예: C:\..., \\NAS\...)도 읽어올 수 있습니다. 운영에서는 false 권장.
app.storage.allow-absolute-path=true
