spring:
  application:
    name: graduation_album

  # ===============================
  # MariaDB
  # ===============================
  datasource:
#    url: jdbc:mariadb://mariadb:3306/elementary_album # nas 경로
    url: jdbc:mariadb://localhost:3306/elementary_album
    driver-class-name: org.mariadb.jdbc.Driver
    username: kim
    password: kim*85928665

  # ===============================
  # JPA
  # ===============================
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect # ⭐ 매우 중요
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # ===============================
  # Thymeleaf
  # ===============================
  thymeleaf:
    cache: false

  # ===============================
  # File Upload
  # ===============================
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# ===============================
# Media Storage (NAS volume)
# ===============================
app:
  media:
#    base-path: /data # nas 경로
    base-path: C:/Dev/elementary_school/copy_graduation_album/data  # 로컬 경로

