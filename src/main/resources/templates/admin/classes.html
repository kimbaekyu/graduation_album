<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>반 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        function showClassroomUploadModal(classroomId) {
            document.getElementById('uploadClassroomId').value = classroomId;
            new bootstrap.Modal(document.getElementById('uploadClassroomModal')).show();
        }
        function uploadClassroomFile(type) {
            const classroomId = document.getElementById('uploadClassroomId').value;
            const fileInput = document.getElementById('classroomFileInput');
            const file = fileInput.files[0];
            if (!file) {
                alert('파일을 선택해주세요.');
                return;
            }
            const formData = new FormData();
            formData.append('file', file);
            const endpoint = type === 'photo' 
                ? `/api/files/classrooms/${classroomId}/group-photo`
                : `/api/files/classrooms/${classroomId}/video-letter`;
            fetch(endpoint, {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                alert(data);
                location.reload();
            })
            .catch(error => {
                alert('업로드 실패: ' + error);
            });
        }
    </script>
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin}">관리자</a>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/}">메인</a>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 fw-bold mb-0">반 관리</h1>
        <a class="btn btn-primary" th:href="@{/admin/classes/new}">추가</a>
    </div>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>반</th>
                    <th>담임</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${classrooms}">
                    <td th:text="${c.id}">1</td>
                    <td th:text="${c.classNum} + '반'">1반</td>
                    <td th:text="${c.homeroomTeacher}">김선생님</td>
                    <td class="text-end">
                        <div class="btn-group">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{|/admin/classes/${c.id}/edit|}">수정</a>
                            <button class="btn btn-sm btn-outline-info" type="button" 
                                    th:onclick="'showClassroomUploadModal(' + ${c.id} + ')'">파일 업로드</button>
                            <form class="d-inline" method="post" th:action="@{|/admin/classes/${c.id}/delete|}">
                                <button class="btn btn-sm btn-outline-danger" type="submit">삭제</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- 파일 업로드 모달 -->
<div class="modal fade" id="uploadClassroomModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">파일 업로드</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="uploadClassroomId">
                <div class="mb-3">
                    <label class="form-label">파일 선택</label>
                    <input type="file" class="form-control" id="classroomFileInput" accept="image/*,video/*">
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary" onclick="uploadClassroomFile('photo')">단체 사진 업로드</button>
                    <button class="btn btn-secondary" onclick="uploadClassroomFile('video')">영상편지 업로드</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
