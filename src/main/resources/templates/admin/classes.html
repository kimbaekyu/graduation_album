<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>반 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin}">관리자</a>
        <a class="btn btn-sm btn-outline-secondary" th:href="@{/}">메인</a>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 fw-bold mb-0">반 관리</h1>
        <a class="btn btn-primary" th:href="@{/admin/classes/new}">추가</a>
    </div>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>반</th>
                    <th>담임</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${classrooms}">
                    <td th:text="${c.id}">1</td>
                    <td th:text="${c.classNum} + '반'">1반</td>
                    <td th:text="${c.homeroomTeacher}">김선생님</td>
                    <td class="text-end">
                        <div class="btn-group">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{|/admin/classes/${c.id}/edit|}">수정</a>
                            <form class="d-inline" method="post" th:action="@{|/admin/classes/${c.id}/delete|}">
                                <button class="btn btn-sm btn-outline-danger" type="submit">삭제</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
