<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 520px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="h4 fw-bold mb-3">관리자 로그인</h1>
            <!-- 로그인 정보 <p class="text-muted small mb-4">기본 계정: admin / admin</p> -->

            <div th:if="${error}" class="alert alert-danger" th:text="${error}">에러</div>

            <form method="post" th:action="@{/admin/login}">
                <div class="mb-3">
                    <label class="form-label">아이디</label>
                    <input class="form-control" name="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">비밀번호</label>
                    <input class="form-control" type="password" name="password" required>
                </div>
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" type="submit">로그인</button>
                    <a class="btn btn-outline-secondary" th:href="@{/}">메인으로</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
