<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>학생 등록/수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/students}">학생 관리</a>
    </div>
</nav>

<main class="container py-4" style="max-width: 860px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="h5 fw-bold mb-3">학생 등록/수정</h1>

            <form method="post"
                  th:object="${student}"
                  th:action="${student.id == null} ? @{/admin/students/new} : @{|/admin/students/${student.id}/edit|}"
                  enctype="multipart/form-data">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">반</label>
                        <select class="form-select" name="classroomId" required>
                            <option value="" disabled th:selected="${student.classroom == null}">선택</option>
                            <option th:each="c : ${classrooms}" 
                                    th:value="${c.id}" 
                                    th:text="${c.classNum} + '반'"
                                    th:selected="${student.classroom != null && student.classroom.id == c.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">이름</label>
                        <input class="form-control" th:field="*{name}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">성별</label>
                        <select class="form-select" th:field="*{gender}">
                            <option value="M">M</option>
                            <option value="W">W</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label">소망(motto)</label>
                        <input class="form-control" th:field="*{motto}">
                    </div>
                    <div class="col-12">
                        <label class="form-label">하고싶은말(talk)</label>
                        <textarea class="form-control" rows="3" th:field="*{talk}"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">개인사진</label>
                        <div class="mb-2">
                            <input type="file" class="form-control" name="personalPhotoFile" accept="image/*">
                            <small class="text-muted">파일을 선택하면 H2 DB에 저장됩니다. (선택사항)</small>
                        </div>
                        <div th:if="${student.id != null && student.personalPhoto != null}" class="mt-2">
                            <img th:src="@{|/media/photo/students/${student.classroom.classNum}/${student.Id}|}"
                                 style="max-width: 200px; max-height: 240px; object-fit: cover;" 
                                 class="border rounded" alt="현재 사진">
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">손편지사진</label>
                        <div class="mb-2">
                            <input type="file" class="form-control" name="handLetterPhotoFile" accept="image/*">
                            <small class="text-muted">파일을 선택하면 H2 DB에 저장됩니다. (선택사항)</small>
                        </div>
                        <div th:if="${student.id != null && student.handLetterPhoto != null}" class="mt-2">
                            <img th:src="@{|/media/photo/students/hand-letter/${student.classroom.classNum}/${student.Id}|}"
                                 style="max-width: 300px; max-height: 200px; object-fit: cover;" 
                                 class="border rounded" alt="현재 사진">
                        </div>
                    </div>

                </div>
                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-primary" type="submit">저장</button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/students}">취소</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
