<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>선생님 등록/수정</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/teachers}">선생님 관리</a>
    </div>
</nav>

<main class="container py-4" style="max-width: 860px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h1 class="h5 fw-bold mb-3">선생님 등록/수정</h1>

            <form method="post"
                  th:object="${teacher}"
                  th:action="${teacher.id == null} ? @{/admin/teachers/new} : @{|/admin/teachers/${teacher.id}/edit|}"
                  enctype="multipart/form-data">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">반</label>
                        <select class="form-select" name="classroomId" required>
                            <option value="" disabled th:selected="${teacher.classroom == null}">선택</option>
                            <option th:each="c : ${classrooms}" 
                                    th:value="${c.id}" 
                                    th:text="${c.classNum} + '반'"
                                    th:selected="${teacher.classroom != null && teacher.classroom.id == c.id}"></option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">이름</label>
                        <input class="form-control" th:field="*{name}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">성별</label>
                        <select class="form-select" th:field="*{gender}">
                            <option value="M">M</option>
                            <option value="W">W</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label">급훈</label>
                        <input class="form-control" th:field="*{classMotto}">
                    </div>
                    <div class="col-12">
                        <label class="form-label">학생들에게</label>
                        <textarea class="form-control" rows="3" th:field="*{talkTo}"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">우리반 약속</label>
                        <textarea class="form-control" rows="3" th:field="*{promise}"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">선생님 사진</label>
                        <div class="mb-2">
                            <input type="file" class="form-control" name="teacherPhotoFile" accept="image/*">
                            <small class="text-muted">파일을 선택하면 H2 DB에 저장됩니다. (선택사항)</small>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">또는 URL 입력</label>
                            <input class="form-control" th:field="*{teacherPhotoUrl}" placeholder="https://...">
                        </div>
                        <div th:if="${teacher.id != null && teacher.teacherPhoto != null}" class="mt-2">
                            <img th:src="@{|/api/files/teachers/${teacher.id}/photo|}" 
                                 style="max-width: 200px; max-height: 250px; object-fit: cover;" 
                                 class="border rounded" alt="현재 사진">
                        </div>
                    </div>
                </div>
                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-primary" type="submit">저장</button>
                    <a class="btn btn-outline-secondary" th:href="@{/admin/teachers}">취소</a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
