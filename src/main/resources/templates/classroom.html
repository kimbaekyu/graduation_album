<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${classroom.classNum} + '반 - 졸업 앨범'">반 - 졸업 앨범</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .desk-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 10px;
        }
        @media (max-width: 992px) { .desk-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        .desk {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        .desk a { text-decoration: none; }
    </style>
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">졸업 앨범</a>
        <div class="d-flex gap-2">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin}">관리자</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex align-items-end justify-content-between mb-3">
        <div>
            <h1 class="h3 fw-bold mb-1" th:text="${classroom.classNum} + '반'">1반</h1>
            <div class="text-muted">
                담임: <span th:text="${classroom.homeroomTeacher}">홍길동</span>
            </div>
        </div>
        <a class="btn btn-outline-primary" th:href="@{/}">메인으로</a>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="h6 fw-bold mb-3">담임 선생님</h2>
                    <div th:if="${teacher == null}" class="text-muted">등록된 선생님 정보가 없습니다.</div>
                    <div th:if="${teacher != null}">
                        <div class="d-flex gap-3">
                            <img class="rounded border"
                                 style="width:120px;height:150px;object-fit:cover"
                                 th:src="${teacher != null && teacher.teacherPhoto != null}
                                    ? @{|/media/photo/teachers/${teacher.id}|}
                                    : 'https://placehold.co/200x250?text=Teacher'"
                                 alt="선생님 사진">
                            <div>
                                <div class="fw-bold" th:text="${teacher.name}">선생님 이름</div>
                                <!-- 선생님 성별 <div class="small text-muted" th:text="'성별: ' + ${teacher.gender}">성별: W</div> -->
                                <div class="mt-2">
                                    <div class="small fw-bold">급훈</div>
                                    <div class="small" th:text="${teacher.classMotto}">급훈</div>
                                </div>
                            </div>
                        </div>
                        <hr>
                        <div class="small fw-bold">학생들에게</div>
                        <div class="small mb-2" th:text="${teacher.talkTo}">학생들에게</div>
                        <div class="small fw-bold">우리반 약속</div>
                        <div class="small mb-3" th:text="${teacher.promise}">약속</div>
                        <div th:if="${classroom.classVideoLetter != null}" class="mb-2">
                            <div class="small fw-bold mb-2 px-3 pt-3">담임선생님 영상편지</div>
                            <video controls
                                   style="width:100%;max-height:300px;border-radius:8px;"
                                   th:if="${classroom.classVideoLetter != null}">
                                <source th:src="@{|/media/video/teachers/${classroom.classNum}|}" type="video/mp4">
                            </video>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card shadow-sm mb-3">
                <img class="card-img-top"
                     style="max-height:260px;object-fit:cover"
                     th:src="${classroom.classGroupPhoto != null}
                        ? @{|/media/photo/classrooms/${classroom.classNum}|}
                        : 'https://placehold.co/900x300?text=Group+Photo'"
                     alt="반 단체 사진">

            </div>

            <div class="card shadow-sm mb-3">
                <div class="card-body">
                    <h2 class="h6 fw-bold mb-3">자리 배치(이름 클릭)</h2>
                    <div class="desk-grid">
                        <div class="desk" th:each="s : ${students}">
                            <a th:href="@{|/students/${s.id}|}"
                               class="fw-bold"
                               th:text="${s.name}">학생</a>

                            <!-- ✅ 성별 표시 (M/W → 남자/여자) -->
                            <div class="small text-muted"
                                 th:text="${s.gender == T(com.elementaryschool.graduation_album.domain.Gender).M ? '남자' : '여자'}">
                                남자
                            </div>

                            <!-- ✅ 학생 개인 사진 -->
                            <img class="rounded border"
                                 style="width:70px;height:100px;object-fit:cover"
                                 th:src="${s.personalPhoto != null}
                                    ? @{|/media/photo/students/${s.classroom.classNum}/${s.id}|}
                                    : 'https://placehold.co/100x100?text=Student'"
                                 alt="학생 사진">
                        </div>
                    </div>

                    <div th:if="${#lists.isEmpty(students)}"
                         class="text-muted mt-2">
                        등록된 학생이 없습니다.
                    </div>

                </div>
                <div th:if="${classroom.studentVideoLetter != null}" class="mb-2">
                    <div class="small fw-bold mb-2 px-3 pt-3">학생들의 영상편지</div>
                    <video controls
                           style="width:100%;max-height:300px;border-radius:8px;"
                           th:src="@{|/media/video/students/${classroom.classNum}|}">
                        비디오 태그 지원안함
                    </video>
                </div>
            </div>
</main>
</body>
</html>
