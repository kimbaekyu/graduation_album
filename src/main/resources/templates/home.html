<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>2009 제7회 쌍령초등학교 졸업 앨범</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero {
            min-height: 60vh;
            display: grid;
            place-items: center;
            background: linear-gradient(180deg, #f8fafc 0%, #ffffff 70%);
        }
        .class-btn { min-width: 110px; }
        .desk-grid {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 10px;
        }
        @media (max-width: 992px) { .desk-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        .desk {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
        }
        .desk a { text-decoration: none; }
    </style>
</head>
<body>
<nav class="navbar navbar-light bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">2009 제7회 쌍령초등학교 졸업 앨범</a>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-sm btn-outline-secondary" th:href="@{/admin}">관리자</a>
        </div>
    </div>
</nav>

<main class="hero">
    <div class="container text-center">
        <img class="img-fluid rounded shadow-sm mb-4"
             alt="학교 이미지"
             src="images/school.png">
        <h1 class="h3 fw-bold mb-3">2009 제7회 쌍령초등학교 졸업 앨범</h1>
        <p class="text-muted mb-4">반을 선택하면 우리 반 페이지로 이동합니다.</p>

        <div class="d-flex flex-wrap justify-content-center gap-2">
            <a th:each="c : ${classrooms}"
               class="btn btn-primary class-btn"
               th:href="@{|/classes/${c.classNum}|}"
               th:text="${c.classNum} + '반'">
                X반
            </a>
        </div>
    </div>
</main>
</body>
</html>
